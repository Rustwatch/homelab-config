---
- name: APPLY DEFAULT Config
  hosts: all
  vars:
    ansible_host_key_checking: false
  tasks:
  - name: Wait until VM is reachable
    ansible.builtin.wait_for_connection:
      delay: 5
      sleep: 10
      timeout: 600

  - name: "INCLUDE ROLE: day0_standard_config"
    ansible.builtin.include_role:
      name: day0_standard_config
