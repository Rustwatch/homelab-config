---
- name: "Create Server YAML File for Terraform Deploy"
  hosts: "localhost"
  connection: local
  gather_facts: false
  tasks: 
  #- name: "PARSE: Variable from YAML string"
  #  ansible.builtin.set_fact:
  #    template_create: "{{ template_create_yaml | from_yaml }}"

  - name: "CHECK: If all values from YAML are set"
    ansible.builtin.assert:
      that:
      - template_create_vm_name is defined
      - template_create_memory_mb is defined
      - template_create_cpu_cores is defined
      - template_create_network_vlan_id is defined
      - template_create_network_address is defined
      - template_create_disks_yaml is defined
      - template_create_tags is defined
  
  - name: "PARSE: Variable from YAML string"
    ansible.builtin.set_fact:
      template_create_disks: "{{ template_create_disks_yaml | from_yaml }}"

  - name: "CHECK: If disk has correct parameters set"
    ansible.builtin.assert:
      that:
      - item.datastore_id is defined
      - item.interface is defined
      - item.size is defined
      - item.mount_point is defined
      - item.filesystem is defined
    loop: "{{ template_create_disks }}"


  - ansible.builtin.debug:
      msg: "{{ template_create.vm_name }}"
