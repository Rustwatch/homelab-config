---
- name: "INSTALL: SELINUX Requirements"
  zypper:
    name: 
    - container-selinux 
    - passt-selinux
    - policycoreutils-python-utils
    state: present
  become: true 

- name: "CONFIGURE: SELinux equivalence for Podman storage"
  community.general.sefcontext:
    target: "{{ day1_deploy_podman_postgres_container_directory }}"
    substitute: /var/lib/containers/storage 
    state: present
  become: true
  notify: Restore SELinux contexts on Podman storage
